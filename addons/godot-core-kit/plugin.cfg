[plugin]

name="godot-core-kit"
description="Reusable Godot 4 GDScript foundation library for 2D games. CoreKit facade over core/ (Log, EventBus, Settings) and systems/ (SceneManager, ObjectPool, SaveManager, FrameScheduler, InputManager, AudioManager, ResourceManager, LocaleManager), plus a KitStateMachine class library;新增 KitContext 层级服务容器(DI);0.6.0 KitContext 增订阅式解析 subscribe + 工厂式 scope provide_factory;0.7.0 SaveManager 增可插拔序列化 SaveSerializer + 原子写(temp+rename)+ 资源引用守卫;0.8.0 KitStateMachine 增事件 dispatch 解耦 add_transition/dispatch(ANYSTATE 通配)+ pushdown push_state/pop_state(暂停语义);0.9.0 新增 DevConsole 调试控制台(CoreKit.console 第 11 子系统,CanvasLayer,debug 门控):日志 overlay + 命令/作弊注册 + GDScript 表达式执行 + 变量 watch;0.10.0 新增 LocaleManager 本地化托管(CoreKit.i18n 第 12 子系统):运行时切语言 + 持久化 + 字体回退 + 缺翻译告警 + 运行时翻译加载;0.11.0 新增 off-facade 重绑定 UI 组件(KitRebindButton/KitRebindList):点击捕获 + 检测拦截冲突 + 复位,InputManager 增 action_for_event;0.12.0 新增 off-facade 可复用转场资源 KitTransition(transitions/,extends Resource):FADE + SLIDE 两类,change_scene 兼容接收 KitTransition 或 legacy 字典;0.13.0 新增 off-facade UI 栈导航 KitUiStack + KitUiScreen(ui/):push/pop/replace/clear、被盖屏 process_mode=DISABLED 停用、模态挡层、返回键 _unhandled_input 兜底;0.14.0 新增门面第 13 子系统 CoreKit.layers(systems/layer_manager.gd):跨场景常驻具名 CanvasLayer(z 序表 HUD..SYSTEM + 保留带 CONSOLE=128/TRANSITION=4096),layer/mount/clear/register_layer;console/transition 只登记不重构;0.15.0 新增门面第 14 子系统 CoreKit.clock(systems/game_clock.gd):年/季/日/时/分 世界时钟,混合推进(time_scale 自动走时 + advance_minutes/day + sleep_to_next_day),原生 signal + CoreKit.bus 广播 clock:*(bind_bus 注入),to_dict/from_dict;确立全 kit 事件命名约定 namespace:event(冒号);0.16.0 新增 off-facade 槽位制物品容器 KitInventory(inventory/,extends RefCounted):固定 capacity 格,add 自动堆叠+填空+溢出返余量,move 空移/合并/交换,per-slot data 分品质,changed 信号,to_dict/from_dict;0.17.0 新增 off-facade 定义数据表 KitDataRegistry(data/,extends RefCounted):type→{id→def} 分组存放游戏自定义 Resource,register + load_dir(扫目录,id 取属性或文件名,剥 .remap),get_def/has_def/all/ids/types/count/clear,零依赖不参与存档;0.18.0 dogfood 驱动的向后兼容便利方法:KitDataRegistry.ids/types 加 sorted 参数(字符串字典序,规避 StringName 指针序坑)、KitInventory.totals()(跨格按 id 聚合)、KitStateMachine.state_name()/is_in()(当前态查询,null 安全);0.19.0 新增 off-facade 离线结算器 KitOffline(offline/,extends RefCounted 纯静态 settle):墙钟差×产率、封顶 8h、时间回拨(now<last)按 0 防作弊,恒定产率精确解(离线补偿与在线同率一致);放置/挂机游戏读档补收益,零依赖不参与存档(调用方持久化 last_seen 时间戳)"
author="luohao"
version="0.19.0"
script="plugin.gd"
