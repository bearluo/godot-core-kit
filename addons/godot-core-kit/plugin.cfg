[plugin]

name="godot-core-kit"
description="Reusable Godot 4 GDScript foundation library for 2D games. CoreKit facade over core/ (Log, EventBus, Settings) and systems/ (SceneManager, ObjectPool, SaveManager, FrameScheduler, InputManager, AudioManager, ResourceManager, LocaleManager), plus a KitStateMachine class library;新增 KitContext 层级服务容器(DI);0.6.0 KitContext 增订阅式解析 subscribe + 工厂式 scope provide_factory;0.7.0 SaveManager 增可插拔序列化 SaveSerializer + 原子写(temp+rename)+ 资源引用守卫;0.8.0 KitStateMachine 增事件 dispatch 解耦 add_transition/dispatch(ANYSTATE 通配)+ pushdown push_state/pop_state(暂停语义);0.9.0 新增 DevConsole 调试控制台(CoreKit.console 第 11 子系统,CanvasLayer,debug 门控):日志 overlay + 命令/作弊注册 + GDScript 表达式执行 + 变量 watch;0.10.0 新增 LocaleManager 本地化托管(CoreKit.i18n 第 12 子系统):运行时切语言 + 持久化 + 字体回退 + 缺翻译告警 + 运行时翻译加载;0.11.0 新增 off-facade 重绑定 UI 组件(KitRebindButton/KitRebindList):点击捕获 + 检测拦截冲突 + 复位,InputManager 增 action_for_event;0.12.0 新增 off-facade 可复用转场资源 KitTransition(transitions/,extends Resource):FADE + SLIDE 两类,change_scene 兼容接收 KitTransition 或 legacy 字典;0.13.0 新增 off-facade UI 栈导航 KitUiStack + KitUiScreen(ui/):push/pop/replace/clear、被盖屏 process_mode=DISABLED 停用、模态挡层、返回键 _unhandled_input 兜底;0.14.0 新增门面第 13 子系统 CoreKit.layers(systems/layer_manager.gd):跨场景常驻具名 CanvasLayer(z 序表 HUD..SYSTEM + 保留带 CONSOLE=128/TRANSITION=4096),layer/mount/clear/register_layer;console/transition 只登记不重构"
author="luohao"
version="0.14.0"
script="plugin.gd"
